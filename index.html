<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link
      href="https://cdn.jsdelivr.net/npm/remixicon@4.9.0/fonts/remixicon.css"
      rel="stylesheet"
    />
    <link
      rel="stylesheet"
      href="https://unpkg.com/boxicons@latest/css/boxicons.min.css"
    />
    <link rel="stylesheet" type="text/css" href="css/style.css" />
    <title>Education Website</title>
  </head>
  <body>
    <header>
      <a href="#"><img src="img/site-logo.png" alt="" class="logo" /></a>

      <ul class="navbar">
        <a href="#">Create Resume</a>
        <a href="#">Skillset </a>
        <a href="#">Partnered Job Board</a>
        <a href="#">Contact Us</a>
      </ul>

      <div class="h-right">
        <a href="#" class="h-btn">
          Register Now
          <span class="h-icon">
            <i class="ri-arrow-right-long-line"></i>
          </span>
        </a>
        <div class="bx bx-menu" id="menu-icon"></div>
      </div>
    </header>

    <section class="hero">
      <div class="hero-content">
        <div class="h-text">
          <a href="#" class="hero-in">
            <i class="ri-lock-star-line"></i>
            Your #1 Platform for Skill Sharing
          </a>
          <h1>Showcase Your Mastery. <br />Get Connected</h1>
          <p>
            Create your profile, showcase your skills, and let employers find
            you.
          </p>
        </div>
        <form action="" class="input-form">
          <div class="input-box input-border">
            <span>Location</span>
            <input type="search" name="" placeholder="Search Places" />
          </div>
          <div class="input-box input-border">
            <span>Start</span>
            <input type="date" name="start-date" id="start-date" />
          </div>
          <div class="input-box">
            <span>Return</span>
            <input type="date" name="return-date" id="return-date" />
          </div>
          <i class="ri-search-line search-btn"></i>
        </form>
      </div>
    </section>

    <script src="js/script.js"></script>
  </body>
</html>
